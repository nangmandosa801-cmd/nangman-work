		<script>
			document.domain = "applyhome.co.kr";

			});
			
			function fn_btnSubmitClick() {

					//$pop.closeDialog(); 
					window.parent.fn_closeKabExceptionDialog();
				} else {
					location.href='/co/coa/selectMainView.do';
				}
			}

		</script>
